flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

  # Android specific
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

  # iOS specific
  remove_alpha_ios: true

  # Web
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#25253d"
